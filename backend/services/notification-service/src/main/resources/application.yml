spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_service}
    username: ${DB_USER:collector}
    password: ${DB_PASSWORD:collector}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
        transport:
          protocol: smtp
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/dept-collector/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8095}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  bounded-context: notification
  capabilities: templates,delivery attempts,channels
  security:
    enabled: ${SECURITY_ENABLED:false}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
