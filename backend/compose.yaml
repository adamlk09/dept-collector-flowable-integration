name: dept-collector

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      POSTGRES_DB: collector
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # Flowable UI 6.8 (Modeler / Task / Admin / IDM) — official image; Flowable 7.x ships no UI apps.
  # It runs on its OWN database (flowable_ui): a 6.8 engine cannot open the 7.2 schema that
  # workflow-service manages (boot-time schema version check fails), so the DB is NOT shared.
  # To inspect the real engine, the Admin app is pre-wired to workflow-service's Flowable REST API
  # (http://host.docker.internal:8094/process-api) — definitions, instances, jobs, diagrams.
  # UI: http://localhost:8090/flowable-ui — login admin / test.
  flowable-ui:
    image: flowable/flowable-ui:6.8.0
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable_ui
      SPRING_DATASOURCE_USERNAME: collector
      SPRING_DATASOURCE_PASSWORD: collector
      # Admin app "Process engine" endpoint → workflow-service on the host.
      # CONTEXTROOT "/" passes the must-be-set validation but is stripped when the URL is
      # composed, yielding http://host.docker.internal:8094/process-api.
      FLOWABLE_ADMIN_APP_SERVERCONFIG_PROCESS_SERVERADDRESS: http://host.docker.internal
      FLOWABLE_ADMIN_APP_SERVERCONFIG_PROCESS_PORT: "8094"
      FLOWABLE_ADMIN_APP_SERVERCONFIG_PROCESS_CONTEXTROOT: "/"
      FLOWABLE_ADMIN_APP_SERVERCONFIG_PROCESS_RESTROOT: "process-api"
      # Admin app "CMMN engine" endpoint → same workflow-service instance (Milestone 1's
      # bankingCollectionCase runs in the same process engine's CMMN sub-engine).
      FLOWABLE_ADMIN_APP_SERVERCONFIG_CMMN_SERVERADDRESS: http://host.docker.internal
      FLOWABLE_ADMIN_APP_SERVERCONFIG_CMMN_PORT: "8094"
      FLOWABLE_ADMIN_APP_SERVERCONFIG_CMMN_CONTEXTROOT: "/"
      FLOWABLE_ADMIN_APP_SERVERCONFIG_CMMN_RESTROOT: "cmmn-api"
      # Admin app "DMN engine" endpoint → segmentation-service (the DMN side of the Flowable
      # split — see backend CLAUDE.md).
      FLOWABLE_ADMIN_APP_SERVERCONFIG_DMN_SERVERADDRESS: http://host.docker.internal
      FLOWABLE_ADMIN_APP_SERVERCONFIG_DMN_PORT: "8092"
      FLOWABLE_ADMIN_APP_SERVERCONFIG_DMN_CONTEXTROOT: "/"
      FLOWABLE_ADMIN_APP_SERVERCONFIG_DMN_RESTROOT: "dmn-api"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Local/dev SMTP sink for notification-service (doc §18: never real credentials in dev).
  # Web UI at http://localhost:8025 shows every email sent by the demo — no real inbox needed.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
